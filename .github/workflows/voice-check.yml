name: Voice engine check (diagnostic)

# Manual check that the word-timing voice still works, and the exact package set it works with
# (used to refresh requirements/render.lock). Never runs on a schedule.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exactly like render.yml
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          if [ -s requirements/render.lock ]; then
            pip install -q -r requirements/render.lock --extra-index-url https://download.pytorch.org/whl/cpu
          else
            pip install -q kokoro-onnx soundfile scipy numpy pillow
            pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            pip install -q "kokoro>=0.9.4"
            pip install -q --force-reinstall --no-deps "preshed==3.0.9"
          fi
      - name: Speak one line with word timings
        run: |
          {
            python - <<'PY' 2>&1
          import traceback
          try:
              from kokoro import KPipeline
              p = KPipeline(lang_code='a', repo_id='hexgrad/Kokoro-82M')
              n = 0
              for r in p('Seven days of warning. In 2026, 6.1 billion dollars.', voice='am_michael', speed=1.1, split_pattern=None):
                  n += sum(1 for t in (r.tokens or []) if t.start_ts is not None)
              print('VOICE OK, timed tokens:', n)
          except Exception:
              traceback.print_exc()
          PY
            echo; echo '== pip freeze'; pip freeze
          } > /tmp/voice.md 2>&1
          cat /tmp/voice.md | head -5
      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete diag-voice -y --cleanup-tag 2>/dev/null || true
          gh release create diag-voice --prerelease --title "DIAG voice" --notes-file /tmp/voice.md
