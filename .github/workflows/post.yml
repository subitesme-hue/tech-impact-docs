name: Post an approved episode (no re-render)

# Posts an episode that was already rendered and reviewed: downloads its release files and runs scripts/post.mjs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag of the approved episode (e.g. ep-2026-10-20-v3-test3)'
        required: true
      post_at:
        description: 'Publish time, ISO UTC (e.g. 2026-10-20T07:00:00Z). Blank = now. The job waits (max ~5 h), so dispatch it within 5 h of the time.'
        required: false
        default: ''
      x_text:
        description: 'Optional X hook (max 35 characters); the episode link is added on the next line'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the approved episode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/logs
          gh release download "${{ inputs.tag }}" -D out -p video.mp4 -p props.json -p cover.jpg
          mv out/props.json props.render.json
          ls -la out

      - name: Post via PostEverywhere
        env:
          PE_API_KEY: ${{ secrets.PE_API_KEY }}
          PE_BASE_URL: ${{ vars.PE_BASE_URL }}
          POST_AT: ${{ inputs.post_at }}
          X_TEXT: ${{ inputs.x_text }}
        run: |
          echo "PE_API_KEY set: $([ -n "$PE_API_KEY" ] && echo yes || echo NO)" | tee out/logs/post.log
          # publish time comes from this run's input (blank = now); caption rules: Facebook = full LinkedIn caption, X hook <= 35 chars
          node -e "
          const f='props.render.json',fs=require('fs');const p=JSON.parse(fs.readFileSync(f));const po=p.post;
          if(po){po.post_at=process.env.POST_AT||'';
            const li=po.main?.platform_content?.linkedin?.content; if(li){po.main.content=li; po.main.platform_content.facebook={content:li};}
            if(process.env.X_TEXT&&po.x) po.x.content=process.env.X_TEXT.slice(0,35);
            console.log('post_at',po.post_at,'| X:',po.x&&po.x.content);}
          fs.writeFileSync(f,JSON.stringify(p))"
          set -o pipefail
          node scripts/post.mjs props.render.json 2>&1 | tee -a out/logs/post.log

      - name: Attach post results
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f out/post_results.json && gh release upload "${{ inputs.tag }}" out/post_results.json --clobber || true
          gh release upload "${{ inputs.tag }}" out/logs/post.log --clobber || true
