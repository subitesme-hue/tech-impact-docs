name: Weekly episode (Thursday, posts 23:00 Dubai)
run-name: ${{ (github.event_name == 'schedule' || inputs.scheduled == 'true') && 'Evening run' || 'Manual daily run' }}

# Replaces the n8n schedule: picks today's region / sector / look / format / voice from history.json and starts
# render.yml with posting on. A workflow_dispatch sent with the built-in GITHUB_TOKEN does start the other workflow
# (GitHub's documented exception for workflow_dispatch), so no personal access token is needed.
on:
  schedule:
    # Weekly: Thursday only (user, 30 Oct 2026). Render starts ~18:30 Dubai, post.mjs waits and publishes at 23:00 Dubai.
    # Two slots because GitHub starts cron runs hours late or skips them; the second run skips itself if the first succeeded.
    # The render job can wait at most ~5 h, so these must stay after ~13:50 UTC.
    - cron: '30 14 * * 4'   # Thu 18:30 Dubai
    - cron: '30 16 * * 4'   # Thu 20:30 Dubai (backup)
  workflow_dispatch:
    inputs:
      post:
        description: 'Post when rendered? (true/false). Manual runs default to false = test.'
        required: false
        default: 'false'
      date:
        description: 'Plan the episode for this evening (YYYY-MM-DD). Blank = today. A test render made ahead is posted by that evening''s scheduled run.'
        required: false
        default: ''
      scheduled:
        description: 'true = this is the evening run (sent by the outside scheduler because GitHub cron starts 4-5 h late or not at all)'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip if tonight's evening run already happened
        if: ${{ github.event_name == 'schedule' || inputs.scheduled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the evening run can arrive twice (outside scheduler at 15:00 and 17:00 UTC + GitHub cron backup); only the first one acts
          today=$(date -u +%Y-%m-%d)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily.yml/runs?created=>=${today}T00:00:00Z&per_page=50" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }} and .display_title == "Evening run" and .conclusion == "success")] | length')
          echo "earlier successful evening runs today: $n"
          if [ "$n" != "0" ]; then echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: Pick today's topic
        if: ${{ env.SKIP != '1' }}
        env:
          SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.scheduled == 'true') && 'true' || 'false' }}
          PICK_DATE: ${{ inputs.date }}
        run: node scripts/pick_topic.mjs
      - name: Start the render
        if: ${{ env.SKIP != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POST: ${{ (github.event_name == 'schedule' || inputs.scheduled == 'true') && 'true' || inputs.post }}
        run: |
          if [ -s reuse.json ]; then
            gh workflow run post.yml --ref main -f tag="$(node -p "require('./reuse.json').tag")" -f post_at="$(node -p "require('./reuse.json').post_at")"
            echo "Scheduled posting of today's rendered episode"; exit 0
          fi
          if [ ! -s topic.json ]; then echo "Nothing to do today."; exit 0; fi
          TAG=$(node -p "require('./topic.json').tag")
          VOICE=$(node -p "require('./topic.json').voice")
          gh workflow run render.yml --ref main -f topic="$(cat topic.json)" -f tag="$TAG" -f voice="$VOICE" -f post="$POST"
          echo "Started render $TAG (post=$POST)"
