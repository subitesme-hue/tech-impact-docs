name: Render and post Tech Impact documentary

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic JSON from n8n (region, sector, voice, look, post time). Research + script are written here.'
        required: false
        default: ''
      props:
        description: 'Finished props JSON (skips research/writing). Blank + blank topic = props.sample.json'
        required: false
        default: ''
      tag:
        description: 'Release tag for this video (n8n sets it)'
        required: true
      voice:
        description: 'Kokoro voice (rotates daily from n8n)'
        required: false
        default: 'am_michael'
      post:
        description: 'Post to Facebook, LinkedIn, YouTube and X after rendering? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: tech-impact-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg + Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q kokoro-onnx soundfile scipy numpy pillow
          # Kokoro (PyTorch) gives word timestamps so cuts land on the spoken words; CPU wheels only.
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" || echo "kokoro (torch) install failed -> voice.py falls back to kokoro-onnx"

      - name: Cache Kokoro (torch) weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-82m-v1

      - name: Cache Kokoro model
        id: kokoro
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-onnx-v1.0

      - name: Download Kokoro model
        if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: T&I News logo (optional)
        env:
          LOGO_URL: ${{ vars.LOGO_URL }}
        run: |
          if [ -n "$LOGO_URL" ] && [ ! -f public/logo.png ]; then curl -sSLf -o public/logo.png "$LOGO_URL" || rm -f public/logo.png; fi
          ls -la public/logo.png 2>/dev/null || echo "no logo file: using the typographic T&I NEWS mark"

      - name: Check API keys (before spending any credits)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p out/logs
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          OR=$(code -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/key)
          PX=$( [ -n "$PEXELS_API_KEY" ] && code -H "Authorization: $PEXELS_API_KEY" "https://api.pexels.com/v1/search?query=city&per_page=1" || echo missing)
          PB=$( [ -n "$PIXABAY_API_KEY" ] && code "https://pixabay.com/api/?key=$PIXABAY_API_KEY&q=city&per_page=3" || echo missing)
          echo "OpenRouter=$OR Pexels=$PX Pixabay=$PB (200 = OK)" | tee out/logs/keys.log
          # OpenRouter is required (research + script). Stock keys are optional: graphics cover for them.
          # Stop only on a definite rejection (401/403); any other code is logged and the run continues.
          case "$OR" in 401|403) { echo "OPENROUTER_API_KEY rejected ($OR) - fix the secret; stopping before any paid call." | tee -a out/logs/keys.log; exit 1; } ;; esac

      - name: Research and write the script
        if: ${{ inputs.topic != '' }}
        env:
          TOPIC: ${{ inputs.topic }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/logs
          printf '%s' "$TOPIC" > topic.json
          echo "OPENROUTER_API_KEY set: $([ -n "$OPENROUTER_API_KEY" ] && echo yes || echo NO)" | tee out/logs/write.log
          set -o pipefail
          node scripts/write.mjs topic.json props.json 2>&1 | tee -a out/logs/write.log

      - name: Write props
        env:
          PROPS: ${{ inputs.props }}
        run: |
          python3 - <<'EOF'
          import json, os
          raw = os.environ.get('PROPS', '').strip()
          if os.path.exists('props.json') and not raw:
              p = json.load(open('props.json', encoding='utf-8'))
          else:
              p = json.loads(raw) if raw else json.load(open('props.sample.json', encoding='utf-8'))
          json.dump(p, open('props.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('title:', p.get('title'), '| region:', p.get('region'), '| sector:', p.get('sector'))
          EOF

      - name: Render (voice, stock media, video, mix)
        env:
          VOICE: ${{ inputs.voice }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONCURRENCY: '4'
        run: |
          mkdir -p out/logs
          echo "PEXELS_API_KEY set: $([ -n "$PEXELS_API_KEY" ] && echo yes || echo NO), PIXABAY_API_KEY set: $([ -n "$PIXABAY_API_KEY" ] && echo yes || echo NO)" | tee out/logs/render.log
          set -o pipefail
          python3 scripts/render.py props.json 2>&1 | tee -a out/logs/render.log

      - name: Publish release (video, thumbnail)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp props.render.json out/props.json; [ -f research.json ] && cp research.json out/research.json || true
          TITLE=$(python3 -c "import json;print(json.load(open('props.json'))['title'])")
          gh release create "$TAG" out/video.mp4 out/cover.jpg out/meta.json out/props.json $(ls out/research.json 2>/dev/null) \
            --title "$TITLE" --notes "Rendered by run ${{ github.run_id }}"

      - name: Remember used stock clips (no repeats across days)
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # daily runs also append the episode to history.json (the topic picker reads it to rotate region, look, format, voice)
          if [ -n "$TOPIC" ] && [ -f out/props.json ]; then
            node -e "
            const fs=require('fs');const p=JSON.parse(fs.readFileSync('out/props.json'));const h=fs.existsSync('history.json')?JSON.parse(fs.readFileSync('history.json')):[];
            h.push({date:p.date,region:p.region,sector:p.sector,look:p.look,format:p.format,voice:p.voice,tag:'${{ inputs.tag }}',title:p.title,post:'${{ inputs.post }}'});
            fs.writeFileSync('history.json',JSON.stringify(h,null,1));"
            git add history.json
          fi
          git add used_media.json
          git commit -qm "Used media + history after ${{ inputs.tag }}" && (git pull -q --rebase && git push -q) || echo "nothing to commit"

      - name: Post via PostEverywhere
        if: ${{ inputs.post == 'true' }}
        env:
          PE_API_KEY: ${{ secrets.PE_API_KEY }}
          PE_BASE_URL: ${{ vars.PE_BASE_URL }}
        run: |
          mkdir -p out/logs
          echo "PE_API_KEY set: $([ -n "$PE_API_KEY" ] && echo yes || echo NO)" | tee out/logs/post.log
          set -o pipefail
          node scripts/post.mjs props.render.json 2>&1 | tee -a out/logs/post.log

      - name: Attach post results
        if: ${{ always() && inputs.post == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: test -f out/post_results.json && gh release upload "${{ inputs.tag }}" out/post_results.json --clobber || true

      - name: Diagnostics release on failure (readable without log access)
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/logs
          { echo "Run ${{ github.run_id }} failed."; for f in out/logs/*.log; do [ -f "$f" ] && { echo; echo "== $f =="; tail -n 80 "$f"; }; done; } > /tmp/diag.md
          gh release delete "diag-${{ inputs.tag }}" -y --cleanup-tag 2>/dev/null || true
          gh release create "diag-${{ inputs.tag }}" --prerelease --title "DIAG ${{ inputs.tag }}" --notes-file /tmp/diag.md
