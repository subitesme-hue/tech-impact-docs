name: Render and post Tech Impact documentary

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic JSON from n8n (region, sector, voice, look, post time). Research + script are written here.'
        required: false
        default: ''
      props:
        description: 'Finished props JSON (skips research/writing). Blank + blank topic = props.sample.json'
        required: false
        default: ''
      tag:
        description: 'Release tag for this video (n8n sets it)'
        required: true
      voice:
        description: 'Kokoro voice (rotates daily from n8n)'
        required: false
        default: 'am_michael'
      post:
        description: 'Post to Facebook, LinkedIn, YouTube and X after rendering? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: tech-impact-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg + Python deps
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q kokoro-onnx soundfile scipy numpy pillow

      - name: Cache Kokoro model
        id: kokoro
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-onnx-v1.0

      - name: Download Kokoro model
        if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: T&I News logo (optional)
        env:
          LOGO_URL: ${{ vars.LOGO_URL }}
        run: |
          if [ -n "$LOGO_URL" ] && [ ! -f public/logo.png ]; then curl -sSLf -o public/logo.png "$LOGO_URL" || rm -f public/logo.png; fi
          ls -la public/logo.png 2>/dev/null || echo "no logo file: using the typographic T&I NEWS mark"

      - name: Research and write the script
        if: ${{ inputs.topic != '' }}
        env:
          TOPIC: ${{ inputs.topic }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/logs
          printf '%s' "$TOPIC" > topic.json
          echo "OPENROUTER_API_KEY set: $([ -n "$OPENROUTER_API_KEY" ] && echo yes || echo NO)" | tee out/logs/write.log
          set -o pipefail
          node scripts/write.mjs topic.json props.json 2>&1 | tee -a out/logs/write.log

      - name: Write props
        env:
          PROPS: ${{ inputs.props }}
        run: |
          python3 - <<'EOF'
          import json, os
          raw = os.environ.get('PROPS', '').strip()
          if os.path.exists('props.json') and not raw:
              p = json.load(open('props.json', encoding='utf-8'))
          else:
              p = json.loads(raw) if raw else json.load(open('props.sample.json', encoding='utf-8'))
          json.dump(p, open('props.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('title:', p.get('title'), '| region:', p.get('region'), '| sector:', p.get('sector'))
          EOF

      - name: Render (voice, stock media, video, mix)
        env:
          VOICE: ${{ inputs.voice }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CONCURRENCY: '4'
        run: |
          mkdir -p out/logs
          echo "PEXELS_API_KEY set: $([ -n "$PEXELS_API_KEY" ] && echo yes || echo NO), PIXABAY_API_KEY set: $([ -n "$PIXABAY_API_KEY" ] && echo yes || echo NO)" | tee out/logs/render.log
          set -o pipefail
          python3 scripts/render.py props.json 2>&1 | tee -a out/logs/render.log

      - name: Publish release (video, summary, thumbnail)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp props.render.json out/props.json; [ -f research.json ] && cp research.json out/research.json || true
          TITLE=$(python3 -c "import json;print(json.load(open('props.json'))['title'])")
          gh release create "$TAG" out/video.mp4 out/summary.mp4 out/cover.jpg out/meta.json out/props.json $(ls out/research.json 2>/dev/null) \
            --title "$TITLE" --notes "Rendered by run ${{ github.run_id }}"

      - name: Remember used stock clips (no repeats across days)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add used_media.json && git commit -qm "Used media after ${{ inputs.tag }}" && git push -q || echo "nothing to commit"

      - name: Post via PostEverywhere
        if: ${{ inputs.post == 'true' }}
        env:
          PE_API_KEY: ${{ secrets.PE_API_KEY }}
          PE_BASE_URL: ${{ vars.PE_BASE_URL }}
        run: |
          mkdir -p out/logs
          echo "PE_API_KEY set: $([ -n "$PE_API_KEY" ] && echo yes || echo NO)" | tee out/logs/post.log
          set -o pipefail
          node scripts/post.mjs props.render.json 2>&1 | tee -a out/logs/post.log

      - name: Attach post results
        if: ${{ always() && inputs.post == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: test -f out/post_results.json && gh release upload "${{ inputs.tag }}" out/post_results.json --clobber || true

      - name: Diagnostics release on failure (readable without log access)
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/logs
          { echo "Run ${{ github.run_id }} failed."; for f in out/logs/*.log; do [ -f "$f" ] && { echo; echo "== $f =="; tail -n 80 "$f"; }; done; } > /tmp/diag.md
          gh release delete "diag-${{ inputs.tag }}" -y --cleanup-tag 2>/dev/null || true
          gh release create "diag-${{ inputs.tag }}" --prerelease --title "DIAG ${{ inputs.tag }}" --notes-file /tmp/diag.md
